#系统配置文件
version: "1.0"
#游戏代号
game_code: 'nova'
#本服所在地区（如：cn | tw | jp | ...）（同语言可能不同地区，所以需要local_area）
local_area: 'cn'
#语言版本（如：zh_CN | zh_TW | en_US）
lang: 'zh_CN'
#监听地址
host: '10.10.30.200'
#使用网络类型
net_type: 'tcp'
#tcp| ws 监听端口号
port: 50012
#web监听端口号
web_port: 50013
#渠道 dev:开发渠道，ios:苹果渠道，android:苹果渠道
platform: 'dev'
#节点id
node_id: 1
#节点名称
node_name: 'nova1@localhost'
#节点cookie
cookie: '123abc'
#节点类型 zc:帐号服,gate:网关，zone:游戏逻辑服
node_type: 'zone'



# 日志相关
logger:
  level: 'debug'            #日志级别 debug|info|warn|error|panic|fatal
  filename: './syslog/console.log'    #日志文件名
  max_size: 2               #日志文件的最大大小(MB为单位)
  max_backups: 10           #保留旧文件的最大个数
  max_age: 10               #保留旧文件的最大天数
  compress: false           #是否压缩/归档旧文件

# mysql相关
mysql:
  host: 127.0.0.1
  port: 3306
  user: 'root'
  password: '123456'
  db: 'nova_dev_1'
  max_open_conns: 32
  max_idle_conns: 16
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

# redis公共连接配置；业务Key由各业务模块定义
redis:
  address: '127.0.0.1:6379'
  username: ''
  password: ''
  db: 0
  pool_size: 32
  dial_timeout: 2s
  read_timeout: 1s
  write_timeout: 1s

# 帐号服配置
account:
  token_ttl: 2h
  http_max_in_flight: 128

# 网关节点配置；port 是 Ergo 集群端口，listen_port 是客户端 TCP 端口
gateway:
  listen_host: '0.0.0.0'
  listen_port: 50014
  auth_url: 'http://127.0.0.1:50013/account/verify'
  zone_node: 'zone1@localhost'
  zone_host: '127.0.0.1'
  zone_port: 50022

# 游戏区服节点配置
zone:
  id: 1
