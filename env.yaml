#系统配置文件
version: 1.0
game_code: 'nova'           #游戏代号
local_area: 'cn'            #本服所在地区（如：cn | tw | jp | ...）（同语言可能不同地区，所以需要local_area）
lang: 'zh_CN'               #语言版本（如：zh_CN | zh_TW | en_US）
host: '10.10.23.160'        #监听地址
port: 50012                 #监听端口号
web_port: 50013             #web监听端口号
node_id: 1                  #节点id
node_type: 'zone'           #节点类型 zc:帐号服,gate:网关，zone:游戏逻辑服
node_name: '1服'            #节点名称
platform: 'dev'             #渠道 dev:开发渠道，ios:苹果渠道，android:苹果渠道

# 日志相关
logger:
  level: 'debug'            #日志级别 debug|info|warn|error|panic|fatal
  filename: './nova.log'    #日志文件名
  max_size: 2             #日志文件的最大大小(MB为单位)
  max_backups: 10           #保留旧文件的最大个数
  max_age: 10               #保留旧文件的最大天数
  compress: false           #是否压缩/归档旧文件

# mysql相关
